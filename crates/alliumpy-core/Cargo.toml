# Local descriptive metadata complements the shared workspace packaging fields.
[package]
name = "alliumpy-core"
version.workspace = true
description = "The Allium parser conversion core"
keywords = ["allium", "parser", "python"]
categories = ["development-tools"]
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

# The interpreter-independent core follows the complete workspace lint policy.
[lints]
workspace = true

# Document the complete public surface on a representative wheel target; docsrs
# matches the local doc gate and allows documentation-specific configuration.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu"]

[lib]
# Stable Rust import name for the conversion API, independent of the Python module.
name = "alliumpy_core"

[dependencies]
allium-parser = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Benchmarks only (decision 0016).
divan = { workspace = true }

# divan supplies its own main, so the libtest harness is off.
[[bench]]
name = "parse"
harness = false
