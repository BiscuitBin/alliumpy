[package]
name = "alliumpy"
version.workspace = true
description = "Python bindings for the Allium parser"
keywords = ["allium", "parser", "python"]
categories = ["development-tools"]
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "forbid"
non_ascii_idents = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unnameable_types = "warn"
unused_qualifications = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
missing_crate_level_docs = "warn"
unescaped_backticks = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
missing_const_for_fn = "warn"
use_self = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unreachable = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
exhaustive_enums = "warn"
exhaustive_structs = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
tests_outside_test_module = "warn"
mod_module_files = "warn"
iter_over_hash_type = "warn"
str_to_string = "warn"
lossy_float_literal = "warn"
float_cmp_const = "warn"
same_name_method = "warn"
# A restriction lint, so the pedantic group does not enable it; clippy.toml sets its threshold.
cognitive_complexity = "warn"
# A type named after its module reads better in a signature than its stem alone;
# the lint would rename it.
module_name_repetitions = "allow"
# cargo-deny's bans.multiple-versions owns this check.
multiple_crate_versions = "allow"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu"]

[lib]
crate-type = ["cdylib"]

[dependencies]
# Caret range with a local path; Cargo.lock pins it (decision 0004).
alliumpy-core = { path = "../alliumpy-core", version = "3.6.1" }
pyo3 = { workspace = true }
