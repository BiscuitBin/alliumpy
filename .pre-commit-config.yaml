# Every tool a hook runs comes from the dev shell (decision 0018): nothing is cloned,
# built or downloaded, and flake.lock pins every checker below. Generated lockfiles are
# excluded so the builtin checks do not parse them on every commit.
exclude: >-
  (?x)^(
    \.git/|
    \.nix/|
    \.direnv/|
    ai_tmp/|
    target/|
    \.tools/|
    dist/|
    target/wheel-smoke/|
    tests/fixtures/parity/.*\.allium$|
    Cargo\.lock$|
    flake\.lock$
  )
repos:
  - repo: local
    hooks:
      # These hooks run through `just`, which keeps each tool's arguments in exactly
      # one place, the recipe. Clippy is deliberately
      # not a hook: a cold build blocks every commit for minutes, so it is a gate
      # in `just check` and a CI step instead.
      - id: fmt-check
        name: rustfmt and nixfmt check
        entry: just fmt-check
        language: system
        pass_filenames: false
        files: ^((crates|fuzz)/.*\.rs|rustfmt\.toml|flake\.nix|nix/.*\.nix)$

      - id: toml-check
        name: taplo format and lint
        entry: just toml-check
        language: system
        pass_filenames: false
        types: [toml]

      - id: deps-unused
        name: Unused dependencies
        entry: just deps-unused
        language: system
        pass_filenames: false
        files: ^(Cargo\.toml|crates/.*/Cargo\.toml|crates/.*\.rs)$

      - id: py-lint
        name: py-lint
        entry: just py-lint
        language: system
        pass_filenames: false
        files: ^(.*\.pyi?|ruff\.toml)$

      - id: py-typecheck
        name: py-typecheck
        entry: just py-typecheck
        language: system
        pass_filenames: false
        files: ^(.*\.pyi?|mypy\.ini)$

      - id: validate-docs
        name: Documentation contract
        entry: bg-validate-docs
        language: system
        pass_filenames: false
        files: ^(README\.md|SECURITY\.md|docs/|pyproject\.toml$)

      - id: validate-agents
        name: Agent instruction contract
        entry: bg-validate-agents
        language: system
        pass_filenames: false
        files: ^(AGENTS\.md|CLAUDE\.md|\.agents/|\.claude/|\.codex/|\.github/copilot-instructions\.md|pyproject\.toml$)

  - repo: builtin
    hooks:
      - id: check-added-large-files
        args: [--maxkb=768]
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      # end-of-file-fixer and trailing-whitespace live in .pre-commit-fix.yaml.
      # This config is the read-only gate, so it may report but never repair;
      # editorconfig-checker and markdownlint report the same defects here.

  # The third-party checkers, as system hooks on the binaries the dev shell provides.
  # Each keeps the id, name, file selection and arguments of the upstream hook it
  # replaces (decision 0018), so `just check-docs` still selects them by id.
  - repo: local
    hooks:
      # Upstream declares no `types`, which would widen this to every file in the
      # repository. Text is what this gate has always read.
      - id: editorconfig-checker
        name: EditorConfig
        entry: editorconfig-checker
        language: system
        types: [text]

      - id: markdownlint-cli2
        name: markdownlint
        entry: markdownlint-cli2
        language: system
        types: [markdown]

      # Upstream's hook passes --write-changes, so a misspelling found here would be
      # rewritten in place. This config is the read-only gate: report only.
      - id: typos
        name: typos
        entry: typos
        args: [--force-exclude]
        language: system
        types: [text]

      - id: lychee
        name: lychee
        entry: lychee
        args: [--offline, --cache, --config, lychee.toml, --no-progress, --root-dir, .]
        language: system
        types: [markdown]
        require_serial: true

      - id: lychee-online
        name: Lychee online (manual)
        entry: lychee
        args: [--cache, --config, lychee.toml, --no-progress, --root-dir, .]
        language: system
        types: [markdown]
        require_serial: true
        stages: [manual]

      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types: [shell]
        require_serial: true

      # actionlint runs the shell's shellcheck over every `run:` block it finds.
      - id: actionlint
        name: actionlint
        entry: actionlint
        language: system
        types: [yaml]
        files: ^\.github/workflows/.*\.ya?ml$

      # Through the checkers' wrapper, which redacts what ripsecrets prints.
      - id: ripsecrets
        name: ripsecrets
        entry: bg-ripsecrets
        args: [--strict-ignore]
        language: system
        types: [text]
        require_serial: true
