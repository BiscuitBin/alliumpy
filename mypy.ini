[mypy]
# Require complete annotations and reject implicit Any at the Python boundary.
strict = True
# Check every Python source root, including the stub and installed-wheel smoke;
# tests/parity is the parity harness (T13).
files = crates/alliumpy/python, crates/alliumpy/tests, tests/fixtures/smoke, scripts, tests/parity
# Recursive discovery skips intentional failures; explicit control paths still run.
exclude = tests/fixtures/py-lint-violation
# Match the wheel's minimum interpreter, rather than pixi's Python.
python_version = 3.11
# Resolve the worktree's stub before the environment's editable installation.
mypy_path = crates/alliumpy/python
# Reject stale suppressions, including those introduced after strict mode changes.
warn_unused_ignores = True
# Report stale module configuration rather than silently accepting it.
warn_unused_configs = True
# Explicitly retain normal traversal: silent or skip would leave the stub unchecked.
follow_imports = normal
