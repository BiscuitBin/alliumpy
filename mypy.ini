[mypy]
# Require complete annotations and reject implicit Any at the Python boundary.
strict = True
# Check every Python source root, including the installed-wheel smoke.
files = src, tests, scripts
# Recursive discovery skips intentional failures; explicit control paths still run.
exclude = tests/fixtures/py-lint-violation
# Match the wheel's minimum interpreter, rather than pixi's Python.
python_version = 3.12
# Resolve the worktree's package before the environment's editable installation.
mypy_path = src
# Reject stale suppressions, including those introduced after strict mode changes.
warn_unused_ignores = True
# Report stale module configuration rather than silently accepting it.
warn_unused_configs = True
# Explicitly retain normal traversal: silent or skip would leave modules unchecked.
follow_imports = normal
# pydantic's plugin is what makes validated models type-check under strict.
plugins = pydantic.mypy

# Libraries that ship no type information, each wrapped in one module under
# src/docmirror that owns the Any boundary.
[mypy-readability.*]
ignore_missing_imports = True
