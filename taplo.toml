# The project manifest and every TOML the tool reads or writes.
include = ["**/*.toml"]
# Generated environments, build output and scratch files have other owners;
# fixtures are input data, including deliberately invalid TOML in later lanes.
exclude = ["target/**", ".pixi/**", "ai_tmp/**", "tests/fixtures/**"]

[formatting]
# House line width and compact two-space TOML nesting.
column_width = 100
indent_string = "  "
# Stable small diffs: no padding churn, and preserve explanatory key/array order.
align_entries = false
reorder_keys = false
reorder_arrays = false
