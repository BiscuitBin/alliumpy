# Mutating counterpart to .pre-commit-nix.yaml, the Nix dev shell's form of
# .pre-commit-fix.yaml (decision 0018): the same fixers, with markdownlint the
# dev shell's own. Never installed as a hook; run it explicitly with `just fix`.
# pixi.lock is YAML, so without this line the builtin check-yaml would parse
# the whole lockfile on every commit.
exclude: >-
  (?x)^(
    \.git/|
    \.pixi/|
    \.direnv/|
    ai_tmp/|
    target/|
    \.tools/|
    tests/fixtures/py-lint-violation/|
    dist/|
    target/wheel-smoke/|
    tests/fixtures/parity/.*\.allium$|
    Cargo\.lock$|
    pixi\.lock$
  )
repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: rustfmt
        entry: cargo fmt --all
        language: system
        pass_filenames: false
        types: [rust]

      # `just fix` is the only caller, so the dev shell is already on PATH here.
      - id: taplo-fmt
        name: taplo format
        entry: taplo fmt
        language: system
        types: [toml]

      - id: ruff-format
        name: ruff-format
        entry: ruff format
        language: system
        files: \.pyi?$

      - id: ruff-fix
        name: ruff-fix
        entry: ruff check --fix
        language: system
        files: \.pyi?$

      - id: cargo-shear-fix
        name: Remove unused dependencies
        entry: cargo shear --fix
        language: system
        pass_filenames: false

  - repo: builtin
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: markdownlint-cli2
        name: markdownlint fix
        entry: markdownlint-cli2 --fix
        language: system
        types: [markdown]
