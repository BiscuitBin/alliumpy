name: Set up the docmirror toolchain
description: >-
  pixi and the environment pixi.lock pins (every tool binary, Python, prek,
  the tooling package's checkers and the package itself), the lockfile sync
  and the hook environments. Runs after the checkout.

runs:
  using: composite
  steps:
    # The one version pin in YAML is pixi itself, which nothing else can
    # install. It must satisfy the `requires-pixi` floor in pyproject.toml,
    # so the version appears twice, exact here and as a floor there, rather
    # than pretend one owner. `locked` refuses a lockfile that disagrees with
    # the manifest, which makes this step the CI lockfile check. Activation
    # puts .pixi/envs/default/bin, and so `just`, on every later step's PATH.
    # The cache is keyed on pixi.lock's hash and written from main only, so
    # one branch's environment cannot evict another's.
    - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
      with:
        pixi-version: v0.81.0
        manifest-path: pyproject.toml
        locked: true
        cache: true
        cache-write: ${{ github.ref == 'refs/heads/main' }}
        activate-environment: true
    # Exactly what the lockfile says, installed, never rewritten.
    - run: just sync
      shell: bash
    # prek's cache outside the workspace, so check-clean's snapshot never
    # sees it. PREK_HOME is prek 0.5.3's cache variable.
    - run: echo "PREK_HOME=${{ runner.temp }}/prek" >> "$GITHUB_ENV"
      shell: bash
    # The hook clones and toolchains every gate job would otherwise fetch
    # again. Keyed on both hook configs and on pixi.lock, which pins prek.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/prek
        key: ${{ runner.os }}-${{ runner.arch }}-prek-${{ hashFiles('.pre-commit-config.yaml', '.pre-commit-fix.yaml', 'pixi.lock') }}
    # The prepare is the point; the shim it writes into the runner's .git is
    # harmless. After this step no gate step reaches the
    # network.
    - run: just install-hooks
      shell: bash
