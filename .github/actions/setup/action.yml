name: Set up the alliumpy dev shell
description: >-
  Nix, the store cache, and the dev shell flake.nix defines and flake.lock pins
  (the toolchain rust-toolchain.toml names, Python, every tool and the shared
  checkers, decision 0018), then the cargo caches and the lockfile sync. Runs
  after the checkout. A job that uses it sets its default shell to the dev
  shell, so every later `run: just <recipe>` step runs inside it.

inputs:
  cache-key:
    description: >-
      Shared key for the cargo cache, one per job, so that an instrumented
      coverage build never restores over a plain one.
    required: true

runs:
  using: composite
  steps:
    # Upstream Nix through its own installer. No input names a github: flake,
    # so no token is passed: every input is fetched from channels.nixos.org or
    # over git.
    - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
    # The Nix store, keyed on everything the shell is built from, so every job
    # on one OS and architecture shares one entry. A hit restores the shell
    # whole; a miss substitutes from cache.nixos.org and builds what it lacks
    # (rustqual, the checkers), and is saved from any branch, because the key
    # alone decides the content. The size bound keeps a growing store from
    # outgrowing the repository's cache quota.
    - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
      with:
        primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock', 'nix/**', 'rust-toolchain.toml') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
        gc-max-store-size: 5G
    # Builds or substitutes the shell once, and refuses a flake.lock that
    # disagrees with flake.nix: CI's lockfile check for the environment.
    - run: nix develop --no-update-lock-file --command true
      shell: bash
    # rust-cache runs `rustc -vV` and `cargo metadata` as an action, outside
    # any shell. Without this line it would find the runner's rustup proxy,
    # which reads rust-toolchain.toml and downloads a second toolchain.
    - run: nix develop --no-update-lock-file --command sh -c 'dirname "$(command -v cargo)"' >> "$GITHUB_PATH"
      shell: bash
    # Saved from main only: a pull request restores main's cache and never
    # writes its own, so one branch's target/ cannot evict another's. The key
    # also hashes flake.lock, because target/ holds build scripts and proc
    # macros linked against the store's libraries, which a moved lock replaces.
    # cache-bin governs ~/.cargo/bin, which holds nothing: every tool is in the
    # dev shell.
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        shared-key: ${{ inputs.cache-key }}
        key: ${{ hashFiles('flake.lock') }}
        save-if: ${{ github.ref == 'refs/heads/main' }}
        cache-bin: false
    # Exactly what the lockfiles say: Cargo.lock and fuzz/Cargo.lock fetched,
    # neither rewritten. After this step no step reaches the network.
    - run: nix develop --no-update-lock-file --command just sync
      shell: bash
