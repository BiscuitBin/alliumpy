name: CI

on:
  pull_request:
  push:
    # Quoted because a branch named `true`, `false`, `null`, `on`, or `1.0` is
    # valid to Git but is not a string to a YAML 1.1 parser.
    branches: ['main']
  workflow_dispatch:
    inputs:
      live:
        description: Run the live crawl suite against the target sites
        type: boolean
        default: false
      oracle:
        description: Run the oracle suite against upstream Markdown endpoints
        type: boolean
        default: false

# Read-only: nothing here publishes, comments or writes a check of its own.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `check`, last, is the one required check; the gate jobs are its `needs`,
# so no name carries a slash or a space. The offline gates run on Linux and
# macOS because the converter and the browser driver carry native code on
# both. wheel-smoke-py312 is the one gate job not on the setup action: it
# installs the wheel on Python 3.12, the floor, which pixi does not have, and
# must not depend on the environment that built it.
jobs:
  python:
    name: python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # One recipe per step, in the gate's order, so a failure names itself
      # in the step list.
      - run: just lock-check
      - run: just toml-check
      - run: just py-lint
      - run: just py-typecheck
      - run: just py-test
      - run: just wheel-smoke
      - run: just version-check
      # The wheel wheel-smoke built and smoked, for wheel-smoke-py312. The
      # recipe empties dist/ first, so exactly one wheel is uploaded.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.os == 'ubuntu-latest'
        with:
          name: wheel
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7
      # Last in every job that runs recipes: `just check` snapshots the
      # worktree between recipes, and these split jobs do not, so without it
      # a recipe that rewrote a tracked file, or left an untracked one, would
      # pass here and fail locally.
      - run: just check-clean

  # The proof of the Python floor: every local run smokes the wheel on pixi's
  # Python 3.14, so only this job shows that the wheel installs and runs on
  # 3.12. Plain shell, no setup action and no `just`, so the proof does not
  # depend on pixi. Network is allowed here: the wheel's dependencies come
  # from PyPI, and `-I` keeps the checkout's sources off the import path.
  wheel-smoke-py312:
    name: wheel-smoke-py312
    needs: [python]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel
          path: dist
      - run: |
          python -m venv venv
          venv/bin/python --version
          venv/bin/pip install dist/*.whl
          venv/bin/python -I tests/fixtures/smoke/smoke.py venv/bin/docmirror
          venv/bin/docmirror --version

  documents:
    name: documents
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: just lint
      - run: just check-docs
      - run: just check-agents
      # For the reason python's last step gives.
      - run: just check-clean

  # Manual only: real crawls of the target sites, with the browser tier
  # installed so escalation can be proved. Not a gate.
  live:
    name: live
    if: github.event_name == 'workflow_dispatch' && inputs.live
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: just install-browser
      - run: just py-test-live

  # Manual only: fidelity against upstream Markdown endpoints. Not a gate.
  oracle:
    name: oracle
    if: github.event_name == 'workflow_dispatch' && inputs.oracle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: just py-test-oracle

  # The one required check. It needs every gate job and fails if any of them
  # failed, was cancelled or was skipped, so protection names `check` alone
  # and never changes when a job is added or renamed: a new gate job joins
  # `needs` here. `if: always()` is what makes it report on a failure instead
  # of being skipped, which is why the step reads `needs.*.result` itself.
  check:
    name: check
    needs: [python, wheel-smoke-py312, documents]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1
