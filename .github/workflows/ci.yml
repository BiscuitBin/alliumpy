name: CI

on:
  pull_request:
  push:
    # Quoted because a branch named `true`, `false`, `null`, `on`, or `1.0` is
    # valid to Git but is not a string to a YAML 1.1 parser.
    branches: ['main']
  workflow_dispatch:

# Read-only: nothing here publishes, comments or writes a check of its own.
# The token each step is minted with can do no more than clone this
# repository, which is what a gate needs and all it needs.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Incremental artefacts are large and never reused on a fresh runner.
  CARGO_INCREMENTAL: '0'
  CARGO_NET_RETRY: '10'
  RUST_BACKTRACE: '1'

# Every gate job runs its steps in the flake's dev shell (decision 0018): the
# setup action installs Nix and restores the shell's store, and the default
# shell below enters it for each `run` step, so every tool is the shell's and
# nothing comes from the runner image. Ubuntu for the split gate jobs: two
# crates and a wheel, with eol=lf forced by .gitattributes and rustfmt; macOS
# on Apple silicon runs the whole gate once, as contributors do. The other
# platforms' wheels are the release workflow's, which has its own setup.
# `check`, last, is the one required check; the gate jobs are its `needs`,
# so no name carries a slash or a space. wheel-smoke-py311 and check are the
# two jobs outside the shell, and set their own shell.
defaults:
  run:
    shell: nix develop --command bash -e {0}

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # One recipe per step, in the gate's order, so a failure names itself
      # in the step list. `check-toolchain` first: it proves the shell's
      # cargo and rustc are the pinned release, with its components, from the
      # Nix store, before anything builds.
      - run: just check-toolchain
      - run: just lock-check
      - run: just fmt-check
      - run: just toml-check
      - run: just nix-check
      - run: just clippy
      # The fuzz crate still builds under cargo-fuzz; clippy above lints it,
      # and this is the only CI line that compiles it the way fuzz.yml does.
      - run: just fuzz-build
      - run: just metrics
      - run: just features
      - run: just test
      - run: just snapshots-check
      - run: just doc
      - run: just deps-unused
      # Last in every job that runs recipes (CONVENTIONS.md §10): `just
      # check` snapshots the worktree between recipes, and these split jobs
      # do not, so without it a recipe that rewrote a tracked file, or left
      # an untracked one, would pass here and fail locally.
      - run: just check-clean

  python:
    name: python
    runs-on: ubuntu-latest
    # The extension is built twice: in place for the tests and stubtest,
    # then as the release wheel for the smoke.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: just py-lint
      - run: just py-typecheck
      - run: just py-test
      - run: just py-stubtest
      - run: just wheel-smoke
      - run: just version-check
      # The wheel wheel-smoke built and smoked, for wheel-smoke-py311. The
      # recipe empties dist/ first, so exactly one wheel is uploaded.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-linux
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7
      # For the reason rust's last step gives.
      - run: just check-clean

  # The one pre-release proof of the abi3 floor (CONVENTIONS.md §9): every
  # local run smokes the wheel on the dev shell's Python 3.14, so only this job
  # shows that the abi3-py311 wheel installs and runs on 3.11. The wheel is the
  # one the python job built in the dev shell; the interpreter is the runner's
  # Python 3.11, from outside Nix on purpose, so the proof also shows that a
  # wheel the shell builds loads on a Python Nix did not provide. Plain shell,
  # no setup action and no `just`.
  # Network is allowed here; `--no-index` and `--no-deps` are what keep the
  # install to the one downloaded file, and `-I` keeps the checkout's
  # sources off the import path.
  wheel-smoke-py311:
    name: wheel-smoke-py311
    needs: [python]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel-linux
          path: dist
      - run: |
          python -m venv venv
          venv/bin/python --version
          venv/bin/pip install --no-index --no-deps dist/*.whl
          venv/bin/python -I tests/fixtures/smoke/smoke.py
          venv/bin/allium --version
          venv/bin/allium check tests/fixtures/smoke/ok.allium

  # Byte-for-byte stdout and exit-code parity with upstream's allium-cli at the
  # pin, and the behaviours beyond the corpus (decision 0014). The reference is
  # the one the dev shell builds and names in ALLIUMPY_PARITY_REFERENCE, so it
  # arrives with the store; version-check's reference clause fires in every
  # shell job, here included.
  parity:
    name: parity
    needs: [python]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: just parity
      - run: just version-check
      # For the reason rust's last step gives.
      - run: just check-clean

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: just coverage
      # Only after the floor passed: the recipe writes lcov.info in its last
      # line, so an upload on failure would fail a second time for the
      # missing file. Seven days is long enough to read a number into a
      # review; nothing downstream consumes it yet.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lcov
          path: target/llvm-cov/lcov.info
          if-no-files-found: error
          retention-days: 7
      # For the reason rust's last step gives; after the upload, so a
      # failure here still leaves the lcov file to read.
      - run: just check-clean

  deny:
    name: deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Licences, bans and sources are answerable from the registry index
      # `just sync` fetched. Advisories are audit.yml's, because they need the
      # RustSec database over the network.
      - run: just deny
      # For the reason rust's last step gives.
      - run: just check-clean

  documents:
    name: documents
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: just lint
      - run: just check-docs
      - run: just check-agents
      # For the reason rust's last step gives.
      - run: just check-clean

  # The whole gate, as a contributor on Apple silicon runs it: `just check`
  # in the dev shell, every recipe in its list with the worktree snapshotted
  # between them. Until a contributor has Nix on a Mac this job is the only
  # place the gate runs on macOS. Parity follows, against the shell's
  # reference and the wheel `check` just smoked.
  macos:
    name: macos
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: just check
      - run: just parity
      # For the reason rust's last step gives.
      - run: just check-clean

  # The build-shaped gates as sandboxed flake checks (decision 0018): a second
  # opinion beside the gate jobs, never instead of them. The sandbox setting is
  # printed first, so the log shows the builds ran with no network.
  nix-flake-check:
    name: nix-flake-check-${{ matrix.system }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: linux
            os: ubuntu-latest
          - system: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Asserted, not printed: a check that built with network access proves
      # nothing about the sandbox. macOS's sandbox is weaker than Linux's, and
      # `relaxed` is accepted there only; nothing here asks to leave it.
      - run: |
          sandbox=$(nix config show sandbox)
          echo "sandbox = $sandbox"
          case "$RUNNER_OS:$sandbox" in
            Linux:true | macOS:true | macOS:relaxed) ;;
            *) exit 1 ;;
          esac
      - run: just nix-flake-check
      # For the reason rust's last step gives.
      - run: just check-clean

  # The one required check (CONVENTIONS.md §10). It needs every gate job and
  # fails if any of them failed, was cancelled or was skipped, so protection
  # names `check` alone and never changes when a job is added, renamed or
  # moved into a reusable workflow: a new gate job joins `needs` here.
  # `if: always()` is what makes it report on a failure instead of being
  # skipped, which is why the step reads `needs.*.result` itself. No checkout,
  # no setup action, and no `${{ }}` inside a shell line.
  check:
    name: check
    needs: [rust, python, wheel-smoke-py311, parity, coverage, deny, documents, macos, nix-flake-check]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1
