name: Fuzz

# Fuzzing is a report, not a gate: it is nondeterministic, and a crash is a
# finding for a person. So this is never a required check, never in ci.yml's
# `check` needs, and never on a pull request. A crash in upstream's parser is
# reported upstream, not fixed here (decision 0016).

on:
  schedule:
    # Mondays, 07:00 UTC, beside mutants and an hour after audit.
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  # A dispatch waits for the scheduled run rather than cancelling it, which
  # would discard a crash the cancelled run had found.
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_NET_RETRY: '10'

jobs:
  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Without it, the first target that crashes cancels its siblings
      # before their 300 s and their uploads.
      fail-fast: false
      matrix:
        target: [parse]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: fuzz
      # The target through env, so no `${{ }}` sits inside a shell line.
      - run: just fuzz "$TARGET" 300
        env:
          TARGET: ${{ matrix.target }}
      # The crashing input, only when there is one. The corpus starts empty on
      # each run; caching it is the refinement if runs stop finding coverage.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 28
