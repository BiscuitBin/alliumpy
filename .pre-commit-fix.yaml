# Mutating counterpart to .pre-commit-config.yaml. Never installed as a hook;
# run it explicitly with `just fix`.
# Every tool comes from the dev shell, as in the gate config. Generated lockfiles are
# excluded so no fixer rewrites them.
exclude: >-
  (?x)^(
    \.git/|
    \.nix/|
    \.direnv/|
    ai_tmp/|
    target/|
    \.tools/|
    tests/fixtures/py-lint-violation/|
    dist/|
    target/wheel-smoke/|
    tests/fixtures/parity/.*\.allium$|
    Cargo\.lock$|
    flake\.lock$
  )
repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: rustfmt
        entry: cargo fmt --all
        language: system
        pass_filenames: false
        types: [rust]

      - id: taplo-fmt
        name: taplo format
        entry: taplo fmt
        language: system
        types: [toml]

      - id: ruff-format
        name: ruff-format
        entry: ruff format
        language: system
        files: \.pyi?$

      - id: ruff-fix
        name: ruff-fix
        entry: ruff check --fix
        language: system
        files: \.pyi?$

      - id: cargo-shear-fix
        name: Remove unused dependencies
        entry: cargo shear --fix
        language: system
        pass_filenames: false

  - repo: builtin
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: nixfmt
        name: nixfmt
        entry: nixfmt
        language: system
        files: ^(flake\.nix|nix/.*\.nix)$

      - id: markdownlint-cli2
        name: markdownlint fix
        entry: markdownlint-cli2
        args: [--fix]
        language: system
        types: [markdown]
