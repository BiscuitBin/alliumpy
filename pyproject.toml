[project]
name = "alliumpy-tooling"
version = "0.1.0"
description = "Repository tooling for alliumpy. The wheel's manifest is crates/alliumpy/pyproject.toml."
requires-python = ">=3.14"
dependencies = []

# typos is configured in _typos.toml; a [tool.typos] here would be ignored.

[tool.biscuit-games-tooling]
recipes = [
  "check-toolchain",
  "lock-check",
  "lint",
  "fmt-check",
  "toml-check",
  "clippy",
  "metrics",
  "features",
  "test-doc",
  "coverage",
  "doc",
  "deny",
  "deps-unused",
  "py-lint",
  "py-typecheck",
  "py-test",
  "py-stubtest",
  "wheel-smoke",
  "version-check",
  "check-docs",
  "check-agents",
  "snapshots-check",
  "nix-check",
]
predicates = {}
