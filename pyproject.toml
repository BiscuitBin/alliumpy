# Configuration for the shared checkers (decision 0002) and nothing else: bg-project-check
# reads [tool.biscuit-games-tooling] for the gate's recipes, in order. The wheel's
# manifest is crates/alliumpy/pyproject.toml. The tools themselves, the checkers
# included, come from the dev shell flake.nix defines (decision 0018).

# typos is configured in _typos.toml; a [tool.typos] here would be ignored.

[tool.biscuit-games-tooling]
recipes = [
  "check-toolchain",
  "lock-check",
  "lint",
  "fmt-check",
  "toml-check",
  "clippy",
  "metrics",
  "features",
  "test-doc",
  "coverage",
  "doc",
  "deny",
  "deps-unused",
  "py-lint",
  "py-typecheck",
  "py-test",
  "py-stubtest",
  "wheel-smoke",
  "version-check",
  "check-docs",
  "check-agents",
  "snapshots-check",
]
predicates = {}
