# Match the wheel's minimum Python, rather than the tooling interpreter.
target-version = "py312"
line-length = 100
# Normal discovery skips deliberately broken controls; generated paths are gitignored.
extend-exclude = ["tests/fixtures/py-lint-violation", "examples/"]
# Leave force-exclude at its false default: explicitly named positive controls must run.

[lint]
# Check every rule so new Python code cannot silently escape a rule family.
select = ["ALL"]
ignore = [
  "COM812",  # Conflicts with the formatter's trailing-comma handling.
  "ISC001",  # Conflicts with the formatter's string layout.
  "D203",    # Incompatible with D211 (no blank line before a class docstring).
  "D213",    # Incompatible with D212 (summary on the first line).
  "TD002",   # Issue links, not author names, track open work.
  "TD003",   # A TODO names its construct; the tracker is the ticket, not a link.
  "FIX002",  # A TODO naming a construct is allowed; the gate is the test's xfail.
  "CPY001",  # The LICENSE file carries the notice; per-file headers are not used here.
  "PLR0917", # Typer subcommands take every flag the specification lists, positionally.
  "TC001",   # Runtime-evaluated annotations (pydantic, Typer) need their imports at runtime.
  "TC003",   # Same: `Path` in a Typer signature is read at runtime.
  "PLR0913", # Pipeline stages carry one argument per fact about a page.
  "C901",    # Complexity is reviewed by hand; a page pipeline has many cases by nature.
  "PLR0912", # Same: branch counts follow the HTTP status space.
  "PLR0911", # Same: one return per outcome of a fetch.
]

[lint.pydocstyle]
# Google convention chooses compatible docstring spacing and summary rules.
convention = "google"

[lint.per-file-ignores]
"tests/{unit,golden,live,oracle}/**" = [
  "E501", # HTML fixture strings are quoted whole, not reflowed; the positive control keeps the rule.
]
"tests/**" = [
  "S101",    # Assertions express the test contract.
  "INP001",  # Tests are discovered without an importable test package.
  "PLR2004", # Expected values are independent literals.
  "D1",      # Test names carry the description.
  "S105",    # Fixture strings that look like secrets are not.
  "S108",    # Fixtures may name temporary paths.
]
"tests/fixtures/smoke/**" = [
  "INP001", # The isolated wheel smoke is a standalone script.
  "S101",   # Assertions are the smoke contract.
  "S603",   # The smoke runs the console script it was handed, without a shell.
  "T201",   # The smoke prints its verdict.
]
"scripts/**" = [
  "INP001", # Repository scripts are standalone, not an importable package.
  "T201",   # The version checker prints its verdict.
  "S603",   # The version checker executes a fixed console-script path without a shell.
]
"src/docmirror/pipeline.py" = [
  "T201", # --dry-run prints the frontier; it is the command's output.
]
"src/docmirror/normalize/islands.py" = [
  "S105", # The island token is a placeholder word, not a secret.
]
"scripts/version_check.py" = [
  "PLR2004", # The version checker requires two version-output words.
]
"src/docmirror/cli/**" = [
  "T201",    # The CLI layer prints its user-facing output.
  "FBT001",  # Typer options are boolean positional parameters by design.
  "FBT002",  # Typer options carry boolean defaults by design.
  "PLR0913", # Subcommands take every flag the specification lists.
  "UP007",   # Typer reads `Optional[...]` annotations at runtime.
]

# All formatter settings retain their defaults.
[format]
