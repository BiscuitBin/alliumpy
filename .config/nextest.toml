# A floor, not a pin: the dev shell's cargo-nextest (flake.lock) must be at least this
# version. Raise it by hand when a profile needs a newer feature (decision 0018).
nextest-version = "0.9.146"

[profile.default]
# Local feedback stops at the first failure.
fail-fast = true

[profile.ci]
# CI collects every failure in one run; retries must not hide flaky tests.
fail-fast = false
retries = 0

[profile.ci.junit]
# Relative to nextest's profile output directory for CI artifact collection.
path = "junit.xml"
