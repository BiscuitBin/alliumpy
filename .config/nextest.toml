# A floor, not a pin: the oldest nextest whose profile semantics this file
# relies on. The dev shell's nextest comes from flake.lock (decision 0018).
nextest-version = "0.9.146"

[profile.default]
# Local feedback stops at the first failure.
fail-fast = true

[profile.ci]
# CI collects every failure in one run; retries must not hide flaky tests.
fail-fast = false
retries = 0

[profile.ci.junit]
# Relative to nextest's profile output directory for CI artifact collection.
path = "junit.xml"
