# The `metrics` gate's configuration (decision 0007 records every number and why).
# Globs resolve against the target directory, so `just metrics` runs rustqual from the
# repository root once per crate, as `rustqual crates/alliumpy-core --config rustqual.toml`
# and `rustqual crates/alliumpy --config rustqual.toml`. IOSP has no `enabled` key and
# always runs.
#
# The rule of this file: every key that can fail the gate is written here, with a
# value that was chosen, and none is left to rustqual's default. Three keys are left
# out because they cannot fail it: `fail_on_warnings`, which the `metrics` recipe
# passes as a flag; `allow_expect`, inert while `detect_error_handling` is off; and
# `[weights]`, which only shapes a score no recipe sets a floor for.

# Upstream's CLI, vendored unchanged under the core's src/cli/ (decision 0014), is
# upstream's code, not this repository's: its shape is upstream's to change, and
# parity, not these metrics, is its gate. cli.rs, this repository's own glue, stays
# measured. Globs resolve against the target directory, as noted above.
exclude_files = ["src/cli/main.rs", "src/cli/test_plan.rs", "src/cli/domain_model.rs"]
# Recursion stays an IOSP finding: a search keeps an explicit stack (decision 0007).
allow_recursion = false
# Closures, iterator chains and `?` are idiomatic Rust, not logic for IOSP to count.
strict_closures = false
strict_iterator_chains = false
strict_error_propagation = false
# At most 5% of functions may need a suppression; exceptions stay exceptional.
max_suppression_ratio = 0.05

# A `qual:allow(dim, target=N)` pin more than this far above the value it covers is a
# finding, so a pin cannot quietly absorb later growth.
[suppression]
pin_headroom = 0.10

# Keep architecture analysis active as the crates grow; no internal module rules yet.
[architecture]
enabled = true

# Bound reasoning per function rather than tuning limits to these thin wrappers.
[complexity]
enabled = true
# SonarSource's recommended ceiling.
max_cognitive = 15
# McCabe's recommended ceiling on independent paths.
max_cyclomatic = 10
# Four nested levels leave control flow readable without extraction for its own sake.
max_nesting_depth = 4
# A production function should fit on one screen.
max_function_lines = 60
# The nesting increment is what makes the measure SonarSource's cognitive complexity.
include_nesting_penalty = true
# Numeric literals require domain judgment, not a generic metric.
detect_magic_numbers = false
# Owned elsewhere: `unsafe_code = "forbid"` in the workspace lint table.
detect_unsafe = false
# Owned elsewhere: clippy's unwrap_used, expect_used and panic, in the same table.
detect_error_handling = false

# Measure cohesion and size before wrapper or conversion types grow.
[srp]
enabled = true
# A sixth parameter usually calls for an input type.
max_parameters = 5
# Tolerate one separable method cluster before reporting weak cohesion.
lcom4_threshold = 2
# Beyond twelve fields or twenty methods, a type merits a responsibility review.
max_fields = 12
max_methods = 20
# Per struct, an input to the composite score; [coupling].max_fan_out is per module.
max_fan_out = 10
# Report the default SRP score at 0.6; weight cohesion most, then fields,
# fan-out and methods, retaining P's chosen composite metric.
smell_threshold = 0.6
weights = [0.4, 0.25, 0.15, 0.2]
# Five hundred code lines keep a type beside its impls without forcing tiny modules.
# Code lines before the first #[cfg(test)]; comments, docs and blanks are not counted.
file_length = 500
# Report three independent groups of private functions; five statements distinguish
# a responsibility from a trivial helper.
max_independent_clusters = 2
min_cluster_statements = 5

# Test code is held to looser limits: a table of cases or a grid literal is long
# without being complex. Unset, each key would inherit the production value.
[tests]
max_function_lines = 100
file_length = 1000

# Keep dependency stability and module fan-in/fan-out bounded as modules arrive.
[coupling]
enabled = true
# A depended-on module may have at most 80% outgoing dependencies.
# Applies to modules something imports; rustqual exempts the rest.
max_instability = 0.8
# Review a module above fifteen consumers or twelve dependencies.
max_fan_in = 15
max_fan_out = 12
# A stable module must not depend on a less stable one.
check_sdp = true

# Duplicates, boilerplate, test quality and structural heuristics are subjective
# checks outside the adopted complexity, cohesion and coupling gate.
[duplicates]
enabled = false

[boilerplate]
enabled = false

[test_quality]
enabled = false

[structural]
enabled = false
