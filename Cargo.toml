[workspace]
# Edition 2024 feature resolution, with both crates discovered under crates/.
resolver = "3"
members = ["crates/*"]

# One packaging version and toolchain floor; both Apache-2.0 crates are unpublished
# on crates.io because the distributable is the Python wheel. Members inherit these fields.
[workspace.package]
version = "3.6.1"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/BiscuitBin/alliumpy"
homepage = "https://github.com/BiscuitBin/alliumpy"
authors = ["Steven Cutting"]
publish = false

# Every level here is `warn` so a local build never breaks mid-edit; `just clippy`
# passes `-D warnings`, which is where a warning becomes a failure.
[workspace.lints.rust]
# Forbid unsafe code even in the bindings; pyo3 emits its own trusted macro internals.
unsafe_code = "forbid"
# Keep identifiers portable and avoid visually confusable names.
non_ascii_idents = "forbid"
# Public Rust API needs docs and Debug; idiom checks keep edition transitions clean.
missing_docs = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
# Expose only reachable, nameable API and remove redundant qualification and casts.
unreachable_pub = "warn"
unnameable_types = "warn"
unused_qualifications = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"

[workspace.lints.rustdoc]
# Treat broken or private API links as errors, and keep crate prose well formed.
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
missing_crate_level_docs = "warn"
unescaped_backticks = "warn"

[workspace.lints.clippy]
# Apply the full pedantic and Cargo policy, allowing individual levels to override groups.
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Keep const-capable functions and self references idiomatic.
missing_const_for_fn = "warn"
use_self = "warn"
# Production code propagates errors and avoids panic paths, placeholders and debug I/O.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unreachable = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
# Leave public data types extensible across upstream parser upgrades.
exhaustive_enums = "warn"
exhaustive_structs = "warn"
# Suppressions must be reasoned expect attributes, so stale exceptions are detected.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# Colocate unit tests in test modules and use the flat Rust module file layout.
tests_outside_test_module = "warn"
mod_module_files = "warn"
# Keep output order deterministic and avoid implicit string allocation or lossy floats.
iter_over_hash_type = "warn"
str_to_string = "warn"
lossy_float_literal = "warn"
float_cmp_const = "warn"
# Inherent and trait methods should not silently compete under one name.
same_name_method = "warn"
# A restriction lint, so the pedantic group does not enable it; clippy.toml sets its threshold.
cognitive_complexity = "warn"
# A type named after its module reads better in a signature than its stem alone;
# the lint would rename it.
module_name_repetitions = "allow"
# cargo-deny's bans.multiple-versions owns this check.
multiple_crate_versions = "allow"

# Dependency policy (decision 0004): Cargo.lock pins the resolved versions.
[workspace.dependencies]
# Exact upstream release is the exception to caret ranges (decision 0011).
allium-parser = "=3.6.1"
# Caret range; Cargo.lock is the pin (decision 0004). The stable Python ABI
# starts at 3.11; maturin supplies extension-module build behavior.
pyo3 = { version = "0.30.1", features = ["abi3-py311"] }

[profile.release]
# Optimize the shipped wheel across crate boundaries, using one codegen unit
# for maximum optimization; wheel-smoke exercises this exact release profile.
lto = "fat"
codegen-units = 1
# Keep the default panic = "unwind": pyo3 converts panics into Python exceptions.

[profile.test]
# Light optimization keeps parser tests fast without release-build compile costs.
opt-level = 1
